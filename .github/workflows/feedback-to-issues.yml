name: Feedback to issues

on:
  schedule:
    - cron: "41 * * * *"      # hourly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gaffer-feedback
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create issues for new feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SB_URL: https://oszrnwhyvmvccxxepsnm.supabase.co
          SB_KEY: sb_publishable_V9itVh6Qu_ThqCfAEV5SBA_PagJsoG4
        run: node scripts/feedback-to-issues.js
