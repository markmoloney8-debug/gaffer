name: Last Man Standing

on:
  schedule:
    - cron: "23 */2 * * *"    # every 2 hours, all week
    - cron: "7,37 11-23 * * 5,6,0,1"   # Fri to Mon, 11:00-23:59 UTC: every 30 minutes on match days (GitHub can delay or skip a run, so the next one is never far away)
    - cron: "7,37 0-12 * * 2"          # Tuesday morning: every 30 minutes, so the next gameweek opens soon after the last one settles
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what would be written, change nothing)"
        type: boolean
        default: false

concurrency:
  group: gaffer-lms
  cancel-in-progress: false

jobs:
  lms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Last Man Standing gameweeks
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SB_URL: https://oszrnwhyvmvccxxepsnm.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/lms.js
