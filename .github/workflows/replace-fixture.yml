name: Replace a fixture

on:
  workflow_dispatch:
    inputs:
      match:
        description: 'Match number to replace (1-5)'
        required: true

concurrency:
  group: gaffer-round
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace the fixture
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SB_URL: https://oszrnwhyvmvccxxepsnm.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MATCH: ${{ github.event.inputs.match }}
        run: node scripts/replace-fixture.js "$MATCH"
