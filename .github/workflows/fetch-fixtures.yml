name: Fetch weekly fixtures

# WARNING: this replaces the current round and clears all entries.
on:
  schedule:
    - cron: "0 7 * * 2"       # Tuesdays 07:00 UTC (08:00 in UK summer time)
    # Retries: GitHub can delay or skip a scheduled run. A scheduled run leaves the round alone while its last match is
    # unfinished, so once the new round is live these do nothing. They only act if the 07:00 run was missed.
    - cron: "40 8-12 * * 2"   # Tuesdays, 08:40 to 12:40 UTC, hourly
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type WIPE to replace the current round and delete all entries'
        required: true

concurrency:
  group: gaffer-round
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'schedule' || github.event.inputs.confirm == 'WIPE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick this week's fixtures
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # A manual run (confirmed with WIPE) replaces the round even if it is still running.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          SB_URL: https://oszrnwhyvmvccxxepsnm.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-fixtures.js
