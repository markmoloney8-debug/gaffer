name: Update results

on:
  schedule:
    - cron: "17 * * * *"      # hourly
  workflow_dispatch:

concurrency:
  group: gaffer-round
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SB_URL: https://oszrnwhyvmvccxxepsnm.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/update-results.js
